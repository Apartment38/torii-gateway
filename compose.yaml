services:
  torii-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TORII_IMAGE:-torii-gateway:local}
    restart: unless-stopped
    working_dir: /state
    command: ["serve", "--config", "/config/config.yaml"]
    environment:
      TORII_API_KEY: ${TORII_API_KEY:-}
    extra_hosts:
      - "host.containers.internal:host-gateway"
    ports:
      - "${TORII_PORT:-8080}:8080"
    volumes:
      - ".:/config:rw,Z,U"
      - "torii_gateway_state:/state:Z,U"
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  torii_gateway_state:
