# Optional file-based secret mount; contains no key material.
# podman compose -f compose.yaml -f compose.secrets.yaml up --build -d
services:
  torii-gateway:
    environment:
      TORII_DB_KEY_FILE: /run/secrets/torii_db_key
      TORII_DB_KEY: ""
    secrets:
      - source: torii_db_key
        target: torii_db_key
secrets:
  torii_db_key:
    file: ${TORII_DB_KEY_SOURCE:-./secrets/torii_db_key}
