# Torii Gateway database-only configuration (schema baseline 4).
# Copy this file to config.yaml and provide the master database key before starting.
# First launch prompts for an administrator and generates an inference API key.
# Persisted credentials use database references; enter secrets in the console.
server:
  # Use 0.0.0.0:8080 when the gateway must listen outside the local machine or
  # container. In containers retain 0.0.0.0:8080; change the host port via TORII_PORT.
  listen: 127.0.0.1:8080

# All durable application state is stored in SQLite.
state:
  database_path: /data/torii.db

# Opt-in background benchmark ingestion. Sources and routing weights are
# independent: leave intelligence disabled to retain existing behavior.
# See docs/benchmark-intelligence.md for source licences, aliases and metrics.
intelligence:
  enabled: false
  refresh_interval: 24h
  http_timeout: 30s
  source_timeout: 30m
  request_interval: 1s # Shared pacing and one in-flight request per benchmark host.
  retries: 2
  stale_after: 168h
  max_age: 4320h
  freshness_half_life: 2160h
  sources:
    - id: aa
      type: artificial_analysis
      enabled: false
      # Set when enabling: api_key: {credential: YOUR_STORED_CREDENTIAL_ID}
    - id: benchlm
      type: benchlm
      enabled: false # CC BY-NC; commercial use requires a BenchLM licence.
    - id: hf
      type: huggingface
      enabled: false
      # Preconfigured Open LLM Leaderboard v2 dataset and raw score mappings.
      # Optional explicit datasets override this preset; see the documentation.
      # Optional token: api_key: {credential: YOUR_STORED_HF_TOKEN_ID}
      # Explicit transport: parquet requires native files; default auto uses rows.
    - id: arena
      type: lmarena
      enabled: false
      transport: auto # Downloads native text_style_control/latest Parquet files.
      # Optional token: api_key: {credential: YOUR_STORED_HF_TOKEN_ID}
    - id: livebench
      type: livebench
      enabled: false
      transport: auto # Downloads native default/leaderboard Parquet files.
      # Use transport: rows only to explicitly retain legacy pagination.
  aggregation:
    overall_weights:
      preference: 0 # Human preference is not an objective benchmark.
  routing:
    capabilities: {overall: 1}
    task_weights:
      coding: {coding: 3, agentic: 1}
      reasoning: {reasoning: 3, math: 1}
    price: 0.2
    latency: 0.1
    throughput: 0.1

providers:
  # Provider IDs become the prefix of public model IDs (for example,
  # local/llama3.2). Each ID must be unique.
  - id: local
    type: ollama
    base_url: http://127.0.0.1:11434

  # The normal OpenAI API profile is origin-locked and uses an external key.
  # Uncomment to expose OpenAI models as openai/<model>.
  # - id: openai
  #   type: openai
  #   base_url: https://api.openai.com
  #   bearer_token:
  #     credential: YOUR_STORED_OPENAI_API_KEY_ID

  # Codex subscription access is endpoint-bound and uses gateway auth login.
  # Configure the model IDs exposed by the subscription backend.
  # - id: openai-codex
  #   type: openai-codex
  #   base_url: https://chatgpt.com/backend-api/codex
  #   models: [gpt-5.5]

  # Nous Portal subscription access uses gateway auth login and a separate
  # Portal refresh-token flow. The inference URL intentionally includes /v1.
  # - id: nous
  #   type: nous
  #   base_url: https://inference-api.nousresearch.com/v1
  #   portal_url: https://portal.nousresearch.com
  #   discover_models: true

  # OpenAI-compatible hosted providers have dedicated profiles so their
  # compatibility roots and credentials are explicit.
  # - id: openrouter
  #   type: openrouter
  #   base_url: https://openrouter.ai/api
  #   bearer_token:
  #     credential: YOUR_STORED_OPENROUTER_API_KEY_ID
  #   # Optional separate management key for /credits quota discovery.
  #   management_token:
  #     credential: YOUR_STORED_OPENROUTER_MANAGEMENT_KEY_ID
  #   discover_models: true
  # - id: gemini
  #   type: gemini
  #   base_url: https://generativelanguage.googleapis.com
  #   bearer_token:
  #     credential: YOUR_STORED_GEMINI_API_KEY_ID
  #   discover_models: true
  # - id: xai
  #   type: xai
  #   base_url: https://api.x.ai
  #   bearer_token:
  #     credential: YOUR_STORED_XAI_API_KEY_ID
  #   discover_models: true
  # - id: anthropic
  #   type: anthropic
  #   base_url: https://api.anthropic.com
  #   bearer_token:
  #     credential: YOUR_STORED_ANTHROPIC_API_KEY_ID
  #   models: [claude-sonnet-4-5]

