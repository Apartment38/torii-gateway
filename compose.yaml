services:
  torii-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${TORII_IMAGE:-torii-gateway:local}
    container_name: torii-gateway
    restart: unless-stopped
    working_dir: /data
    command: ["serve"]
    environment:
      TORII_DB_KEY: ${TORII_DB_KEY:-}
    extra_hosts:
      - "host.containers.internal:host-gateway"
    ports:
      - "${TORII_PORT:-8080}:8080"
    volumes:
      - "torii_gateway_database:/data:Z"
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck", "--url", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  torii_gateway_database:
