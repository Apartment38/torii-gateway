name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify console and release checks
        run: |
          node scripts/build-console.mjs --check
          node internal/web/app_test.mjs
          node internal/web/auth_test.mjs
          node scripts/check-release.test.mjs

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Build production container
        run: docker build --platform linux/amd64 --build-arg VERSION=ci -t torii-gateway:ci .

      - name: Check container metadata
        run: |
          test "$(docker image inspect torii-gateway:ci --format '{{.Architecture}}')" = amd64
          test "$(docker image inspect torii-gateway:ci --format '{{.Config.User}}')" = 'nonroot:nonroot'
          docker run --rm torii-gateway:ci version | tee /tmp/torii-version.txt
          test "$(head -n1 /tmp/torii-version.txt)" = 'Torii Gateway ci'

      - name: Validate non-root container persistence and recovery
        run: |
          sudo apt-get update
          sudo apt-get install -y podman sqlite3 jq openssl
          docker save torii-gateway:ci | podman load
          bash scripts/test-credential-container.sh docker.io/library/torii-gateway:ci
